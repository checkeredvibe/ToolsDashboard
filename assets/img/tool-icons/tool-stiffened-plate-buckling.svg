<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Stiffened Plate Buckling icon">
  <rect x="4" y="4" width="88" height="88" rx="16" fill="none" stroke="#708090" stroke-width="2.5"/>
  <!-- stiffener 2 (back, near the far side edge): hangs below the plate -->
  <path d="M21.2 42.8 L65.2 42.8 L65.2 52.8 L21.2 52.8 Z" fill="#272974" stroke="#708090" stroke-width="1.25" stroke-linejoin="round"/>
  <path d="M21.2 42.8 L20.27 42.18 L20.27 52.18 L21.2 52.8 Z" fill="#272974" stroke="#708090" stroke-width="1.25" stroke-linejoin="round"/>
  <!-- stiffener 1 (front, near the near side edge): hangs below the plate -->
  <path d="M25.1 45.4 L69.1 45.4 L69.1 55.4 L25.1 55.4 Z" fill="#272974" stroke="#708090" stroke-width="1.25" stroke-linejoin="round"/>
  <path d="M25.1 45.4 L24.17 44.78 L24.17 54.78 L25.1 55.4 Z" fill="#272974" stroke="#708090" stroke-width="1.25" stroke-linejoin="round"/>
  <!-- plate slab on top: thickness faces (brand) + top surface sliver (naval grey) -->
  <path d="M22 42 L74 42 L74 46 L22 46 Z" fill="#272974" stroke="#708090" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M22 42 L16 38 L16 42 L22 46 Z" fill="#272974" stroke="#708090" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M22 42 L74 42 L68 38 L16 38 Z" fill="#708090"/>
  <!-- compression arrows: in line with the stiffeners, both acting towards the plate -->
  <path d="M9.5 45 L16.5 45 M12 42.8 L16.5 45 L12 47.2" stroke="#708090" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86.5 45 L79 45 M83.5 42.8 L79 45 L83.5 47.2" stroke="#708090" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
