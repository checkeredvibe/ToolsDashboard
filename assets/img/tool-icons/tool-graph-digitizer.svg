<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Graph Digitizer icon">
  <rect x="4" y="4" width="88" height="88" rx="16" fill="none" stroke="#708090" stroke-width="2.5"/>
  <!-- Symbol offset: edit translate(x, y) to nudge the symbol inside the border.
       x positive: right, negative: left. y positive: down, negative: up. -->
  <g transform="translate(-3.75, 3.75)">
    <!-- axes -->
    <path d="M30 22 V64 H76" stroke="#708090" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27.5 24.5 L30 22 L32.5 24.5" stroke="#708090" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M73.5 61.5 L76 64 L73.5 66.5" stroke="#708090" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- stress-strain (Young's modulus) curve: steep linear elastic rise, then yield plateau -->
    <path d="M30 64 L46 42 C50 37.5 55 34.5 61 33 C66 31.9 70.5 31.4 75 31.2" stroke="#708090" stroke-width="5.75" fill="none" stroke-linecap="round"/>
    <path d="M30 64 L46 42 C50 37.5 55 34.5 61 33 C66 31.9 70.5 31.4 75 31.2" stroke="#272974" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- digitized points: yield point and a point on the plateau -->
    <circle cx="46" cy="42" r="2" fill="#ffffff" stroke="#708090" stroke-width="1.25"/>
    <circle cx="61" cy="33" r="2" fill="#ffffff" stroke="#708090" stroke-width="1.25"/>
  </g>
</svg>
